<style>
/* Concept: a night-sky "mirror" for the student's feelings; glass cards over a slow aurora, one big rounded tap target per question. */
:root{
  --bg:#0E0D23; --bg2:#1A1745; --card:rgba(255,255,255,.07); --card-solid:#1D1B47; --line:rgba(255,255,255,.15);
  --fg:#F5F3FF; --muted:#B4B0DA; --acc:#6D4DF2; --acc-soft:#A18CFF; --on-acc:#fff;
  --mint:#34E0B1; --coral:#FF7A6B; --sun:#FFCB47; --sky:#55B7FF; --pink:#FF6FB5; --sand:#D2B07A; --red:#FF5568; --teal:#3CC8D6;
  --shadow:0 12px 32px rgba(0,0,0,.38); --blobop:.38; --font-d:'Lalezar','Vazirmatn',Tahoma,sans-serif; --font-b:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F7F5FF; --bg2:#E7E1FF; --card:rgba(255,255,255,.82); --card-solid:#FFFFFF; --line:rgba(40,26,120,.15);
  --fg:#1B1740; --muted:#575288; --acc:#5638E0; --acc-soft:#6E4FF0;
  --mint:#0FB588; --coral:#EE5648; --sun:#F2A200; --sky:#2A8FE6; --pink:#E8459A; --sand:#B98A45; --red:#E23A52; --teal:#14A8B8;
  --shadow:0 12px 30px rgba(60,40,160,.16); --blobop:.3; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F7F5FF; --bg2:#E7E1FF; --card:rgba(255,255,255,.82); --card-solid:#FFFFFF; --line:rgba(40,26,120,.15);
  --fg:#1B1740; --muted:#575288; --acc:#5638E0; --acc-soft:#6E4FF0;
  --mint:#0FB588; --coral:#EE5648; --sun:#F2A200; --sky:#2A8FE6; --pink:#E8459A; --sand:#B98A45; --red:#E23A52; --teal:#14A8B8;
  --shadow:0 12px 30px rgba(60,40,160,.16); --blobop:.3; color-scheme:light;}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.7;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:3px solid var(--acc-soft);outline-offset:2px;border-radius:12px}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(56px);will-change:transform;opacity:var(--blobop);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--acc);top:-24vmax;right:-20vmax}
.aurora i:nth-child(2){background:var(--pink);bottom:-26vmax;left:-24vmax;animation-delay:-7s}
.aurora i:nth-child(3){background:var(--mint);top:38%;right:-34vmax;width:44vmax;height:44vmax;animation-delay:-13s;opacity:calc(var(--blobop) * .7)}
@keyframes drift{to{transform:translate3d(-8vmax,6vmax,0) scale(1.12)}}
#app{max-width:560px;margin:0 auto;padding-block:20px 120px}
.enter{animation:slidein .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
h1,h2,h3{font-family:var(--font-d);font-weight:400;margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.stack{display:flex;flex-direction:column;gap:14px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card-solid);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:18px;font-weight:800;color:var(--on-acc);
  background:linear-gradient(135deg,var(--acc),var(--pink));box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:0 14px;font-size:.9rem;border-radius:14px}
.btn.danger{background:linear-gradient(135deg,var(--red),var(--coral))}
.icon{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:1.3rem;flex:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:54px;height:54px;border-radius:18px;background:conic-gradient(from 210deg,var(--acc),var(--pink),var(--sun),var(--mint),var(--acc));display:grid;place-items:center;flex:none;animation:spin 14s linear infinite}
.logo b{width:34px;height:34px;border-radius:50%;background:var(--bg);display:block;box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--fg) 12%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 70%,#000),color-mix(in srgb,var(--pink) 60%,var(--acc)));color:#fff;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-50px;bottom:-70px;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%)}
.hero .btn{background:#fff;color:#2b1a8f;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.input{width:100%;min-height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:10px 16px}
textarea.input{min-height:90px;resize:vertical}
.input:focus{border-color:var(--acc-soft);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc-soft) 30%,transparent)}
label.lb{display:block;font-weight:800;margin-bottom:8px}
.avatar{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-family:var(--font-d);font-size:1.3rem;color:#fff;flex:none}
.code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate;letter-spacing:.12em;font-weight:700;padding:2px 10px;border-radius:10px;background:color-mix(in srgb,var(--acc-soft) 22%,transparent);display:inline-block;font-size:.85rem}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:.8rem;font-weight:800;background:var(--card-solid);background:color-mix(in srgb,var(--c,var(--acc-soft)) 22%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--acc-soft)) 55%,transparent)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc-soft))}
.sc{display:flex;gap:12px;align-items:center;text-align:start;width:100%;margin-bottom:10px}
.sc:active{transform:scale(.985)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{min-height:76px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;font-weight:800;text-align:center;transition:transform .15s,background .2s}
.tile .em{font-size:1.9rem;line-height:1.2}
.tile:active{transform:scale(.95)}
.tile.pop{animation:pop .35s}
.tile.sel{border-color:var(--c,var(--acc-soft));background:var(--card-solid);background:color-mix(in srgb,var(--c,var(--acc-soft)) 26%,var(--card-solid));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--acc-soft)) 35%,transparent),0 10px 24px color-mix(in srgb,var(--c,var(--acc-soft)) 35%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:transform .15s}
.chip:active{transform:scale(.95)}
.chip.pop{animation:pop .3s}
.chip.sel{border-color:var(--acc-soft);background:var(--card-solid);background:color-mix(in srgb,var(--acc-soft) 28%,var(--card-solid));font-weight:800}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:48px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-weight:800;transition:transform .15s;min-width:0}
.seg button:active{transform:scale(.94)}
.seg button.pop{animation:pop .3s}
.seg button.sel{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--acc),var(--pink))}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin-top:4px}
.q{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step .btn{min-height:44px;width:44px;padding:0;border-radius:14px;font-size:1.3rem}
.step b{font-family:var(--font-d);font-weight:400;font-size:1.6rem;min-width:44px;text-align:center}
.list1{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.list1 .chip{border-radius:16px;min-height:52px;padding:6px 12px;justify-content:center;text-align:center;font-size:.9rem;line-height:1.4}
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.prog{flex:1;height:12px;border-radius:99px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--pink),var(--sun));transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px var(--pink)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 55%,transparent)}
.bar>div{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bar .btn:last-child{flex:1}
.shake{animation:shake .4s}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sun),var(--coral));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:5px solid var(--acc);box-shadow:0 4px 12px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--acc)}
.big{font-family:var(--font-d);font-size:2.6rem;line-height:1.1}
.meter{height:12px;border-radius:99px;background:color-mix(in srgb,var(--fg) 12%,transparent);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.dimrow{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:.9rem}
.dimrow b{text-align:end;font-variant-numeric:tabular-nums}
.ringbox{position:relative;width:132px;height:132px;flex:none}
.ringbox svg{transform:rotate(-90deg);width:100%;height:100%}
.ringbox .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:2.4rem}
.ring-bg{stroke:color-mix(in srgb,var(--fg) 14%,transparent)}
.ring-fg{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ins{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ins i{font-style:normal;font-weight:800;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 25%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.scroll-x{overflow-x:auto;max-width:100%}
table.heat{border-collapse:separate;border-spacing:5px;min-width:100%;font-size:.85rem}
table.heat th{font-weight:600;color:var(--muted);white-space:nowrap;padding:2px 4px}
table.heat th:first-child{text-align:start;position:sticky;right:0}
table.heat td.c{min-width:54px;height:42px;border-radius:12px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg);background:color-mix(in srgb,var(--c) calc(var(--k) * 1%),color-mix(in srgb,var(--fg) 8%,transparent))}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-inline-end:6px}
.stackbar{display:flex;height:22px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.stackbar i{display:block;background:var(--c);min-width:0}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-b)}
.chart .vt{fill:var(--fg);font-weight:800}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:800;box-shadow:var(--shadow);animation:slidein .3s both;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
.demo{background:color-mix(in srgb,var(--sun) 20%,transparent);border:1px dashed var(--sun);border-radius:16px;padding:8px 14px;font-size:.85rem}
details summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
.sub-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:4px 0}
@media (max-width:380px){.dimrow{grid-template-columns:92px 1fr 32px}.grid3{gap:6px}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.aurora i,.logo{animation:none!important}.draw{stroke-dashoffset:0}}
</style>

<script>
/*LOGIC_START*/
const FA='۰۱۲۳۴۵۶۷۸۹';

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const SUBJECTS=['ریاضی','علوم و فنون','جامعه‌شناسی','روانشناسی','عربی','تاریخ و جغرافیا','فلسفه و منطق','اقتصاد'];

const PHYS=[{id:'heart',n:'تپش قلب',e:'💓'},{id:'sweat',n:'عرق کردن',e:'💦'},{id:'head',n:'سردرد',e:'🤕'},{id:'tired',n:'خستگی شدید',e:'😴'},{id:'scatter',n:'پراکندگی تمرکز',e:'🌀'},{id:'none',n:'هیچ‌کدام',e:'✅'}];
const PEAK=[{id:'start',n:'ابتدا'},{id:'mid',n:'میانه'},{id:'end',n:'پایان'}];
const REACT=[{id:1,n:'روی سؤال ماندم تا حل شود'},{id:2,n:'رهایش کردم و رفتم جلو'},{id:3,n:'بدون فکر حدس زدم'},{id:4,n:'با حذف گزینه حدس زدم'},{id:5,n:'از این سؤال به آن سؤال پریدم'},{id:6,n:'عجله کردم و تند شدم'},{id:7,n:'کند شدم و گیر کردم'},{id:8,n:'بی‌خیال شدم'}];
const COPE=[{id:'breath',n:'نفس عمیق',e:'🌬️'},{id:'elim',n:'حذف گزینه‌ها',e:'✂️'},{id:'time',n:'مدیریت زمان',e:'⏱️'},{id:'easy',n:'سراغ سؤال آسان‌تر',e:'🪜'},{id:'talk',n:'گفتگوی درونی مثبت',e:'💬'},{id:'none',n:'راهبردی نداشتم',e:'🤷'}];

const PRE=[{k:'sleep',n:'کیفیت خواب شب قبل',a:'بد',b:'عالی'},{k:'prep',n:'آمادگی درسی که حس می‌کردم',a:'کم',b:'زیاد'},{k:'stress',n:'استرس قبل از شروع آزمون',a:'کم',b:'زیاد'},{k:'energy',n:'انرژی و تمرکز در شروع آزمون',a:'کم',b:'زیاد'}];
const TRACKS=[
 {id:'human',n:'انسانی',e:'📚',books:[['ریاضی','علوم و فنون','جامعه‌شناسی','روانشناسی'],['عربی','تاریخ و جغرافیا','فلسفه و منطق','اقتصاد']]},
 {id:'math',n:'ریاضی',e:'📐',books:[['حسابان','آمار و احتمال','هندسه'],['فیزیک','شیمی']]},
 {id:'exp',n:'تجربی',e:'🧪',books:[['زیست'],['فیزیک','شیمی'],['ریاضی','زمین‌شناسی']]}];
const allSubs=t=>{const T=TRACKS.find(x=>x.id===t);return T?[].concat(...T.books):[]};

const DIMS=[
 {k:'emo',n:'فشار هیجانی',c:'--coral',d:'اضطراب، نشانه‌های بدنی و سؤال‌هایی که بلد بودی ولی حل نشد'},
 {k:'focus',n:'افت تمرکز',c:'--sky',d:'پراکندگی ذهن و دیر برگشتن تمرکز'},
 {k:'time',n:'مدیریت زمان',c:'--sun',d:'سؤال‌های وقت‌گیر، عجله یا کند شدن'},
 {k:'react',n:'واکنش و راهبرد',c:'--acc-soft',d:'رها شدن، حدس بی‌هدف، نبود راهبرد و اثر دومینو'},
 {k:'know',n:'غافلگیری و آمادگی',c:'--mint',d:'سؤال‌های غافلگیرکننده و حدس‌های زیاد'}];

 time:'برای هر سؤال یک سقف زمانی بگذار. اگر از آن گذشت، علامت بزن و برو جلو؛ در ۵ دقیقهٔ آخر برگرد.',
 react:'قبل از آزمون بعد یک راهبرد را تمرین کن: حذف گزینه، علامت‌گذاری و بازگشت، یا بازبینی ۵ دقیقهٔ آخر.',
 know:'سؤال‌های غافلگیرکننده را در یک دفتر خطا بنویس و مبحثشان را قبل از آزمون بعد مرور کن.'};
const emoOf=id=>EMO.find(e=>e.id===id);
const emoName=id=>{const e=emoOf(id);return e?e.n:''};
const dimOf=k=>DIMS.find(d=>d.k===k);
const avg5=d=>Math.round((d.emo+d.focus+d.time+d.react+d.know)/5);

function scoreSubject(s,pre,sa){
  const neg=[1,3,6,7].includes(s.emo)?s.int/5:(s.emo===4?0.4*s.int/5:0);
  const physN=(s.phys||[]).filter(p=>['heart','sweat','head'].includes(p)).length;
  const phys=Math.min(physN/3,1);
  const stress=pre&&pre.stress?(pre.stress-1)/4:0;
  const ev=s.ev||{surp:0,knew:0,slow:0,env:0};
  const knew=Math.min(ev.knew/5,1);
  const emo=100*(0.45*neg+0.25*phys+0.1*stress+0.2*knew);
  const scat=(s.phys||[]).includes('scatter')||(s.phys||[]).includes('tired')?1:0;
  const focus=100*(0.5*(5-s.focus)/4+0.3*Math.min((s.rec||0)/15,1)+0.2*scat);
  const time=100*(0.6*Math.min(ev.slow/5,1)+0.25*([6,7].includes(s.react)?1:0)+0.15*Math.min(ev.env/3,1));
  const wk={no:1,part:0.5,yes:0}[s.worked]||0;
  const reactS=100*(0.35*([3,5,6,8].includes(s.react)?1:(s.react===2?0.3:0))+0.25*(s.cope==='none'?1:0)+0.2*wk+0.2*(s.domino?1:0));
  const guessR=sa?sa.guess/Math.max(1,sa.sure+sa.hes+sa.guess):0;
  const know=100*(0.6*Math.min(ev.surp/5,1)+0.4*guessR);
  return {emo:Math.round(emo),focus:Math.round(focus),time:Math.round(time),react:Math.round(reactS),know:Math.round(know)};
}
function dominantOf(d){let k=null,v=-1;for(const x of ['emo','focus','time','react','know']){if(d[x]>v){v=d[x];k=x;}}return v<25?null:k;}
function levelOf(t){return t<15?'آرام':t<28?'قابل‌مدیریت':t<40?'پرچالش':'پرفشار';}
function examDims(ex){
  const subs=ex.subjects.filter(s=>ex.ans&&ex.ans[s]);
  const per={},sum={emo:0,focus:0,time:0,react:0,know:0};
  subs.forEach(s=>{const d=scoreSubject(ex.ans[s],ex.pre,ex.sa&&ex.sa[s]);per[s]=d;for(const k in sum)sum[k]+=d[k];});
  const n=subs.length||1,overall={};
  for(const k in sum)overall[k]=Math.round(sum[k]/n);
  const total=Math.round(Object.values(overall).reduce((a,b)=>a+b,0)/5);
  const tally={};subs.forEach(s=>{const a=ex.ans[s];tally[a.emo]=(tally[a.emo]||0)+a.int;});
  let top=null,tv=-1;for(const k in tally)if(tally[k]>tv){tv=tally[k];top=+k;}
  return {per,overall,total,dom:dominantOf(overall),emo:top,subs};
}
function resultStats(ex){
  if(!ex.res)return null;
  const per={},err={ign:0,emo:0,time:0,care:0};let ps=0,as=0,n=0;
  ex.subjects.forEach(s=>{
    const r=ex.res[s],sa=ex.sa&&ex.sa[s];if(!r)return;
    const gap=sa?sa.pred-r.actual:null;
    per[s]={actual:r.actual,pred:sa?sa.pred:null,gap,
      sureAcc:sa&&sa.sure?Math.round(100*r.sureOk/sa.sure):null,
      guessAcc:sa&&sa.guess?Math.round(100*r.guessOk/sa.guess):null,
      calib:gap==null?null:(gap>10?'over':gap<-10?'under':'ok')};
    for(const k in err)err[k]+=(r.err&&r.err[k])||0;
    if(sa){ps+=sa.pred;as+=r.actual;n++;}
  });
  const wrong=Object.values(err).reduce((a,b)=>a+b,0);
  let top=null,tv=0;for(const k in err)if(err[k]>tv){tv=err[k];top=k;}
  return {per,err,wrong,topErr:top,gapAvg:n?Math.round((ps-as)/n):null};
}
function buildInsights(cur,prev,hist){
  const out=[],C=examDims(cur);
  if(prev){
    const P=examDims(prev),dt=C.total-P.total;
    out.push({k:dt<=-3?'good':dt>=3?'bad':'info',t:Math.abs(dt)<3?'شاخص کلی دشواری هیجانی تقریباً ثابت ماند ('+fa(P.total)+' ← '+fa(C.total)+')':'شاخص کلی دشواری هیجانی از '+fa(P.total)+' به '+fa(C.total)+' رسید'});
    DIMS.forEach(d=>{const x=C.overall[d.k]-P.overall[d.k];if(Math.abs(x)>=8)out.push({k:x<0?'good':'bad',t:d.n+' نسبت به آزمون قبل '+fa(Math.abs(x))+' واحد '+(x<0?'کمتر':'بیشتر')+' شد'});});
    if(P.emo&&C.emo&&P.emo!==C.emo)out.push({k:'info',t:'هیجان غالب از «'+emoName(P.emo)+'» به «'+emoName(C.emo)+'» تغییر کرد'});
    const ch=[];C.subs.forEach(s=>{if(P.per[s])ch.push({s,d:avg5(C.per[s])-avg5(P.per[s])});});
    ch.sort((a,b)=>a.d-b.d);
    if(ch.length){const b=ch[0],w=ch[ch.length-1];
      if(b.d<=-8)out.push({k:'good',t:'بیشترین بهبود در «'+b.s+'» بود ('+fa(Math.abs(b.d))+' واحد کمتر)'});
      if(w.d>=8)out.push({k:'bad',t:'بیشترین افت در «'+w.s+'» بود ('+fa(w.d)+' واحد بیشتر)'});}
  }
  const idx=hist.findIndex(e=>e.id===cur.id);
  C.subs.forEach(s=>{
    const dm=dominantOf(C.per[s]);if(!dm)return;
    let n=1;
    for(let i=idx-1;i>=0;i--){const e=hist[i];if(!e.ans||!e.ans[s])break;const d=dominantOf(scoreSubject(e.ans[s],e.pre,e.sa&&e.sa[s]));if(d!==dm)break;n++;}
    if(n>=2)out.push({k:'bad',t:'در «'+s+'»، «'+dimOf(dm).n+'» '+fa(n)+' آزمون پیاپی علت غالب بوده'});
  });
  return out;
}

  const col=key==='all'?'--acc-soft':dimOf(key).c;

  if(vals.length<2)return '<div class="muted small" style="text-align:center;padding:18px 0">برای دیدن روند، حداقل دو آزمون لازم است. فعلاً مقدار: <b>'+fa(vals[0]||0)+'</b></div>';
  const mx=clamp(Math.ceil((Math.max(...vals)+8)/10)*10,40,100),n=vals.length;
  const X=i=>W-R-i*(W-L-R)/(n-1),Y=v=>T+(1-v/mx)*(H-T-B);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+' L'+pts[n-1][0].toFixed(1)+' '+(H-B)+' L'+pts[0][0].toFixed(1)+' '+(H-B)+' Z';
  let g='';[0,mx/2,mx].forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+fa(Math.round(v))+'</text>';});
  let dots='',lbl='';
  pts.forEach((p,i)=>{const last=i===n-1;dots+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(last?6:4)+'" style="fill:var('+col+');stroke:var(--bg);stroke-width:2"/>';
    dots+='<text class="vt" x="'+p[0].toFixed(1)+'" y="'+(p[1]-10).toFixed(1)+'" text-anchor="middle">'+fa(vals[i])+'</text>';
    if(n<=6||i%2===0)lbl+='<text x="'+p[0].toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+fdate(exams[i].date,true)+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="نمودار روند"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var('+col+');stop-opacity:.35"/><stop offset="1" style="stop-color:var('+col+');stop-opacity:0"/></linearGradient></defs>'+g+'<path d="'+area+'" fill="url(#ga)"/><path class="draw" d="'+line+'" fill="none" style="stroke:var('+col+')" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1200"/>'+dots+lbl+'</svg>';
}
function heatmap(exams){

/* ---------- render ---------- */
function render(anim){
  ui.anim=anim;
  const v=ui.view;
  app.innerHTML=v==='home'?vHome():v==='stu'?vStudent():v==='newstu'?vNewStu():v==='report'?vReport():v==='wiz'?vWiz():v==='res'?vRes():v==='backup'?vBackup():vHome();
  if(anim)window.scrollTo(0,0);
  setTimeout(post,30);
  if(v==='report'&&ui.fresh&&anim){ui.fresh=false;confetti();buzz([20,40,20]);}
}
function post(){
  document.querySelectorAll('[data-w]').forEach(el=>{el.style.width=el.dataset.w+'%';});
  document.querySelectorAll('.ring-fg').forEach(el=>{el.style.strokeDashoffset=el.dataset.off;});
  document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;if(RM)return;const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);el.textContent=fa(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f);})(t0);});
}
function confetti(){
  if(RM)return;const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cols=['#6D4DF2','#FF6FB5','#34E0B1','#FFCB47','#55B7FF','#FF7A6B'];
  const P=Array.from({length:120},()=>({x:W/2,y:H*0.3,vx:(Math.random()-.5)*15,vy:-Math.random()*14-3,r:Math.random()*5+3,c:cols[Math.random()*6|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();});if(++f<160)requestAnimationFrame(tick);else c.remove();})();
}

/* ---------- actions ---------- */
function startDraft(sid){
  DB.draft=newDraft(sid);if(sid&&!DB.draft.title)DB.draft.title='آزمون شمارهٔ '+fa(examsOf(sid).length+1);
  persist();ui.wq='';go('wiz',{step:0});
}
function finalizeExam(){
  const d=DB.draft;
  const ex={id:'e'+Date.now().toString(36),sid:d.sid,track:d.track,skipped:d.skipped||[],title:d.title.trim(),date:d.date,pre:d.pre,subjects:d.subjects,ans:d.ans,thoughts:d.thoughts||[],other:d.other||'',hardest:d.hardest||'',sa:d.sa,created:Date.now()};
  DB.exams.push(ex);DB.draft=null;persist();
  stack.length=0;ui={view:'report',sid:d.sid,eid:ex.id,step:0,dim:'all',q:'',fresh:true,rs:null,confirm:null};render(true);
}
function toggleIn(arr,v){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}
const actions={
  back(){goBack();},
  newq(el){const id=el.dataset.id;startDraft(id||null);},
  resume(){go('wiz',{step:ui.step||0});},
  discard(){DB.draft=null;persist();render(false);},
  newstu(){go('newstu',{ns:{name:'',grade:''}});},
  nsgrade(el){ui.ns.grade=el.dataset.v;rr(el,0);},
  nssave(){const n=(ui.ns.name||'').trim();if(!n){toast('نام را بنویس');return;}const s={id:newCode(),name:n,grade:ui.ns.grade||'',created:Date.now()};DB.students.push(s);persist();buzz(20);stack.pop();go('stu',{sid:s.id});toast('کد دانش‌آموز: '+s.id);},
  open(el){go('stu',{sid:el.dataset.id});},
  report(el){go('report',{eid:el.dataset.id});},
  dim(el){ui.dim=el.dataset.v;rr(el,0);},
  copy(el){copyText(el.dataset.v);},
  confirmdel(){ui.confirm='del';render(false);},
  cancel(){ui.confirm=null;render(false);},
  delstu(){const id=ui.sid;DB.exams=DB.exams.filter(e=>e.sid!==id);DB.students=DB.students.filter(s=>s.id!==id);if(DB.draft&&DB.draft.sid===id)DB.draft=null;persist();goBack();toast('حذف شد');},
  backup(){go('backup');},
  copyjson(){copyText($('#jsonsrc').value);},
  dljson(){try{const b=new Blob([$('#jsonsrc').value],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ayene-azmoon-backup.json';document.body.appendChild(a);a.click();a.remove();toast('فایل ساخته شد');}catch(e){toast('دانلود اینجا ممکن نیست؛ از «کپی پشتیبان» استفاده کن');}},
  import(){try{const j=JSON.parse($('#imp').value);let a=0,b=0;(j.students||[]).forEach(s=>{if(!stuOf(s.id)){DB.students.push(s);a++;}});(j.exams||[]).forEach(e=>{if(!DB.exams.some(x=>x.id===e.id)){DB.exams.push(e);b++;}});persist();toast(fa(a)+' دانش‌آموز و '+fa(b)+' آزمون اضافه شد');}catch(e){toast('متن پشتیبان معتبر نیست');}},
  confirmwipe(){ui.confirm='wipe';render(false);},
  wipe(){DB={students:[],exams:[],draft:null,seeded:true};persist();stack.length=0;ui={view:'home',sid:null,eid:null,step:0,dim:'all',q:'',fresh:false,rs:null,confirm:null};render(true);toast('همه‌چیز پاک شد');},
  res(el){const ex=DB.exams.find(e=>e.id===el.dataset.id);const data={};ex.subjects.forEach(s=>{const old=ex.res&&ex.res[s],sa=ex.sa[s];data[s]=old?JSON.parse(JSON.stringify(old)):{actual:sa.pred,sureOk:0,guessOk:0,err:{ign:0,emo:0,time:0,care:0}};});go('res',{eid:ex.id,step:0,rs:{data,reason:ex.reason||''}});},
  set(el){const d=el.dataset,root=ui.view==='res'?ui:DB.draft;let v=d.v;if(d.t==='number')v=+v;else if(d.t==='boolean')v=v==='true';setP(root,d.p,v);buzz();if(ui.view==='wiz')persist();rr(el,1);},
  step(el){const d=el.dataset,root=ui.view==='res'?ui:DB.draft;const cur=+getP(root,d.p)||0;setP(root,d.p,clamp(cur+(+d.d),+d.min,+d.max));buzz(6);if(ui.view==='wiz')persist();rr(el,0);},
  phys(el){const a=DB.draft.ans[el.dataset.s],v=el.dataset.v;if(v==='none')a.phys=a.phys.includes('none')?[]:['none'];else{a.phys=a.phys.filter(x=>x!=='none');toggleIn(a.phys,v);}buzz();persist();rr(el,0);},
  cope(el){const a=DB.draft.ans[el.dataset.s],v=el.dataset.v;a.cope=v;if(v==='none')a.worked='no';else if(a.worked==='no'&&!a._w)a.worked=undefined;buzz();persist();rr(el,0);},
  tth(el){toggleIn(DB.draft.thoughts,el.dataset.v);buzz();persist();rr(el,0);},
  trk(el){const d=DB.draft,id=el.dataset.v;if(d.track!==id){d.track=id;d.subjects=[];d.ans={};d.sa={};d.skipped=[];allSubs(id).forEach(addSubject);}buzz();persist();rr(el);},
  tsub(el){const d=DB.draft,x=el.dataset.v;if(d.subjects.includes(x)){if(d.subjects.length<=1){toast('حداقل یک درس باید روشن بماند');return;}d.subjects=d.subjects.filter(y=>y!==x);delete d.ans[x];delete d.sa[x];}else{addSubject(x);d.skipped=(d.skipped||[]).filter(y=>y!==x);}buzz();persist();rr(el);},
  skip(el){const d=DB.draft,s=el.dataset.s;if(d.subjects.length<=1){toast('حداقل یک درس باید باقی بماند');return;}
    const old=stepsFor(d);let i=ui.step;while(i<old.length&&old[i].s===s)i++;const nx=old[i];
    d.subjects=d.subjects.filter(x=>x!==s);delete d.ans[s];delete d.sa[s];d.skipped=d.skipped||[];if(!d.skipped.includes(s))d.skipped.push(s);
    const ns=stepsFor(d);ui.step=Math.max(0,ns.findIndex(x=>x.t===nx.t&&x.s===nx.s));persist();buzz(15);toast('«'+s+'» رد شد');render(true);},
  wpick(el){DB.draft.sid=el.dataset.id;DB.draft.newMode=false;buzz();persist();rr(el,0);},
  wnew(el){const d=DB.draft;d.newMode=!d.newMode;if(d.newMode){d.sid=null;d.nw=d.nw||{name:'',grade:''};}persist();rr(el,0);},
  wgrade(el){DB.draft.nw.grade=el.dataset.v;persist();rr(el,0);},
  wprev(){goBack();},
  wnext(){
    if(ui.view==='res')return resNext();
    const d=DB.draft,steps=stepsFor(d),st=steps[ui.step];
    if(!valid(st,d)){const bar=$('#nextbtn');if(bar){bar.classList.remove('shake');void bar.offsetWidth;bar.classList.add('shake');}buzz([30,30,30]);toast('همهٔ بخش‌های این صفحه را کامل کن');return;}
    if(st.t==='who'&&d.newMode){const s={id:newCode(),name:d.nw.name.trim(),grade:d.nw.grade||'',created:Date.now()};DB.students.push(s);d.sid=s.id;d.newMode=false;d.fixed=true;
      d.title=d.title||'آزمون شمارهٔ ۱';toast('کد '+s.id+' ساخته شد');}
    else if(st.t==='who'&&!d.title)d.title='آزمون شمارهٔ '+fa(examsOf(d.sid).length+1);
    buzz(10);
    if(ui.step>=steps.length-1){finalizeExam();return;}
    persist();
    if(st.t==='who'){const ns=stepsFor(d);ui.step=ns.findIndex(x=>x.t==='exam');}else ui.step++;
    render(true);
  }
};
function addSubject(x){const d=DB.draft;d.subjects.push(x);const o=allSubs(d.track);d.subjects.sort((a,b)=>{const ia=o.indexOf(a),ib=o.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  d.ans[x]={phys:[],ev:{surp:0,knew:0,slow:0,env:0},rec:0};d.sa[x]={pred:60,sure:0,hes:0,guess:0};}
function rr(el,auto){
  const sig=el&&el.dataset?{a:el.dataset.a,p:el.dataset.p,v:el.dataset.v,s:el.dataset.s,id:el.dataset.id}:null,y=window.scrollY||0;
  render(false);window.scrollTo(0,y);
  if(!sig)return;
  const t=[...app.querySelectorAll('[data-a]')].find(x=>x.dataset.a===sig.a&&x.dataset.p===sig.p&&x.dataset.v===sig.v&&x.dataset.s===sig.s&&x.dataset.id===sig.id);
  if(!t)return;
  if(t.matches('.tile,.chip,.seg button'))t.classList.add('pop');
  if(auto){const c=t.closest('.card')||t.parentElement,n=c&&c.nextElementSibling;if(n&&n.getBoundingClientRect){const r=n.getBoundingClientRect();if(r.bottom>innerHeight-90||r.top<0)setTimeout(()=>n.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'}),120);}}
}
function resNext(){
  const ex=DB.exams.find(e=>e.id===ui.eid),n=ex.subjects.length;
  if(ui.step<n){ui.step++;buzz(10);render(true);return;}
  ex.res=ui.rs.data;ex.reason=ui.rs.reason||'';persist();
  stack.length=0;ui={view:'report',sid:ex.sid,eid:ex.id,step:0,dim:'all',q:'',fresh:true,rs:null,confirm:null};render(true);
}
function copyText(t){
  const fb=()=>{try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('کپی شد');}catch(e){toast('کپی نشد');}};
  try{navigator.clipboard.writeText(t).then(()=>toast('کپی شد'),fb);}catch(e){fb();}
}
app.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||!actions[t.dataset.a])return;actions[t.dataset.a](t,e);});
app.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.in;if(!k)return;
  if(k==='search'){ui.q=t.value;$('#slist').innerHTML=studentList();return;}
  if(k==='wsearch'){ui.wq=t.value;$('#wl').innerHTML=whoList(DB.draft);return;}
  if(k==='nsname'){ui.ns.name=t.value;return;}
  if(k==='wnname'){DB.draft.nw.name=t.value;persist();return;}
  const root=ui.view==='res'?ui:DB.draft;
  if(k==='range'){setP(root,t.dataset.p,+t.value);const o=document.getElementById(t.dataset.o);if(o)o.textContent=fa(t.value)+'٪';}
  else if(k==='text'){setP(root,t.dataset.p,t.value);if(t.dataset.p==='date'){const p=$('#edp');if(p)p.textContent=fdate(t.value);}}
  if(ui.view==='wiz')persist();
});
render(true);
</script>
